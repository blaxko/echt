# Quality gates, then the read-only public demo to GitHub Pages on every push to main.
# The build reads only committed files (scenarios/runs and fixtures). It has no server and no secrets.
# Rollback: revert the bad commit on main and push. The next run redeploys the previous state.
name: pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests (policy, server, scripts, web, contracts)
        run: pnpm test
      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level=high
      - name: Public build
        run: pnpm --filter @echt/web build:public
      - uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: apps/web/dist-public

  cre-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: CRE workflow helpers (Bun)
        working-directory: cre/echt-verdict/echt-verdict
        run: |
          bun install --frozen-lockfile
          bun test

  deploy:
    needs: [gates, cre-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @echt/web build:public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist-public
      - id: deployment
        uses: actions/deploy-pages@v4
